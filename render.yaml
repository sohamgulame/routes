databases:
  - name: auraner-db
    databaseName: auraner_db
    user: auraner_user
    plan: free
    postgresMajorVersion: "16"

services:
  # -------------------------------------------------------------
  # 1. Python FastAPI AI & XGBoost Microservice
  # -------------------------------------------------------------
  - type: web
    name: auraner-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # -------------------------------------------------------------
  # 2. Spring Boot Java 17 Backend
  # -------------------------------------------------------------
  - type: web
    name: auraner-backend
    runtime: docker
    dockerContext: ./project
    dockerfilePath: ./project/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auraner-db
          property: connectionString
      - key: AURANER_DB_HOST
        fromDatabase:
          name: auraner-db
          property: host
      - key: AURANER_DB_PORT
        fromDatabase:
          name: auraner-db
          property: port
      - key: AURANER_DB_NAME
        fromDatabase:
          name: auraner-db
          property: database
      - key: AURANER_DB_USER
        fromDatabase:
          name: auraner-db
          property: user
      - key: AURANER_DB_PASSWORD
        fromDatabase:
          name: auraner-db
          property: password
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: auraner-ai
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: TOMTOM_API_KEY
        value: 6rZ5FVNhVl1RKi5TjGZTjw3CgqNxcAxK

  # -------------------------------------------------------------
  # 3. React Single Page Application (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: auraner-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: auraner-backend
          property: host
          path: /api/v1
      - key: VITE_WS_URL
        fromService:
          type: web
          name: auraner-backend
          property: host
          path: /ws-telemetry
